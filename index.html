<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff6f8">
<title>قائمة الحلويات</title>
<meta name="description" content="صنع بحب، ويُقدَّم بحب">
<meta property="og:title" content="قائمة الحلويات">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍰%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   الهوية البصرية — غيّر هذه الألوان فقط لكل عميل
   ============================================================ */
:root{
  --gold:#c2336b; --gold-soft:rgba(194,51,107,.35);
  --bg:#fff6f8; --bg-rgb:255,246,248; --card:#ffffff; --line:rgba(194,51,107,.14);
  --text:#3a1f2b; --muted:#8b6b78; --red:#d12e55; --green:#2f9a62;
  --on-gold:#fff; --panel:#fffafb; --ph1:#ffe3ec; --ph2:#ffc9db;
  --hero-bg:linear-gradient(135deg,#ffe0ea,#ffc2d6 60%,#f7a1bf); --deco:"🍰";
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Tajawal',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  line-height:1.6;overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
img{display:block;max-width:100%}

/* ---------- الهيدر ---------- */
.topbar{
  position:fixed;inset:0 0 auto 0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;
  transition:background .3s, backdrop-filter .3s;
}
.topbar.solid{background:rgba(11,11,12,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.icon-btn{position:relative;width:44px;height:44px;display:grid;place-items:center;color:var(--gold)}
.icon-btn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cart-count{
  position:absolute;top:2px;left:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--gold);color:#111;font-size:11px;font-weight:700;display:none;place-items:center;
}
.topbar-logo{height:34px;opacity:0;transition:opacity .3s}
.topbar.solid .topbar-logo{opacity:1}

/* ---------- الواجهة (Hero) ---------- */
.hero{
  position:relative;min-height:min(78vh,520px);
  display:flex;align-items:center;overflow:hidden;
  padding:90px 24px 70px;
}
.hero-bg{
  position:absolute;inset:0;background-size:cover;background-position:center;
  background-color:#17110a;
}
.hero-bg::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(270deg,rgba(11,11,12,.92) 0%,rgba(11,11,12,.55) 55%,rgba(11,11,12,.2) 100%),
    linear-gradient(0deg,var(--bg) 0%,transparent 40%);
}
.hero-inner{position:relative;max-width:1100px;width:100%;margin:auto}
.hero-logo{height:64px;margin-bottom:18px}
.hero-logo-text{
  display:inline-block;margin-bottom:18px;padding:6px 16px;
  border:1px solid var(--gold-soft);border-radius:999px;color:var(--gold);font-weight:600;font-size:15px;
}
.hero h1{font-size:clamp(40px,9vw,76px);font-weight:700;line-height:1.15;letter-spacing:-.5px}
.hero p{margin-top:10px;font-size:clamp(16px,3.4vw,22px);color:var(--muted)}
.hero .rule{width:64px;height:2px;background:var(--gold);margin-top:22px}
.scroll-hint{
  position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  width:26px;height:42px;border:1.5px solid var(--gold-soft);border-radius:14px;
  display:grid;place-items:start center;padding-top:8px;
}
.scroll-hint i{width:4px;height:8px;border-radius:2px;background:var(--gold);animation:drop 1.8s ease-in-out infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}70%{transform:translateY(14px);opacity:0}100%{opacity:0}}

/* ---------- الأقسام ---------- */
main{max-width:1000px;margin:0 auto;padding:0 18px 20px}
.section{padding-top:44px;scroll-margin-top:70px}
.section-head{text-align:center;margin-bottom:24px}
.section-head .title-row{display:flex;align-items:center;justify-content:center;gap:16px}
.section-head .title-row::before,
.section-head .title-row::after{content:"";height:1px;width:min(90px,16vw);background:var(--gold)}
.section-head h2{font-size:28px;font-weight:700}
.section-head p{margin-top:4px;color:var(--muted);font-size:15px}

/* بطاقة كبيرة */
.dish{
  position:relative;display:flex;align-items:stretch;overflow:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  margin-bottom:22px;min-height:280px;
}
.dish-body{flex:1.1;padding:26px 28px;display:flex;flex-direction:column;justify-content:center;gap:10px;position:relative;z-index:2}
.dish-media{flex:1;position:relative;min-height:240px}
.dish-media img,.ph{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.dish-media::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,var(--card) 0%,transparent 45%)}
.dish h3{font-size:30px;font-weight:700;line-height:1.25}
.dish .desc{color:var(--muted);font-size:16px;max-width:36ch}
.dish .price-row{display:flex;align-items:center;gap:14px;margin-top:2px}
.price{color:var(--gold);font-weight:700;font-size:20px}
.price small{font-size:13px;font-weight:500;margin-inline-start:3px}
.add-btn{
  padding:7px 18px;border:1px solid var(--gold);border-radius:999px;color:var(--gold);
  font-weight:600;font-size:14px;transition:background .2s,color .2s;
}
.add-btn:hover,.add-btn:active{background:var(--gold);color:#111}

/* الشارة */
.badge{
  align-self:flex-start;display:inline-flex;align-items:center;gap:6px;
  padding:5px 16px;font-weight:700;font-size:14px;color:#fff;
  transform:rotate(-4deg);border-radius:4px;
}
.badge.chef{background:var(--red)}
.badge.new{background:var(--green)}
.badge.hot{background:#c4511a}

/* مكونات الصنف */
.tags{display:flex;margin-top:12px;border-top:1px solid var(--line);padding-top:14px}
.tag{flex:1;text-align:center;font-size:12.5px;color:var(--muted);padding:0 6px;position:relative}
.tag + .tag::before{content:"";position:absolute;inset-block:4px;inset-inline-end:100%;width:1px;background:var(--line)}
.tag span{display:block;font-size:24px;line-height:1.2;margin-bottom:2px;filter:grayscale(1) sepia(1) saturate(4) brightness(1.05)}

/* شبكة الأصناف الصغيرة */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.mini-media{position:relative;aspect-ratio:4/3}
.mini-body{padding:12px 12px 14px;text-align:center;font-weight:600;font-size:15px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;align-items:center;flex:1;justify-content:center}
.mini .price{font-size:16px}
.mini .add-btn{padding:4px 14px;font-size:13px}

/* placeholder بدون صورة */
.ph{display:grid;place-items:center;font-size:64px;background:radial-gradient(circle at 50% 40%,#2a2013,#101010 70%)}
.ph span{filter:grayscale(.2) drop-shadow(0 6px 14px rgba(0,0,0,.6))}

/* ---------- الفوتر ---------- */
footer{
  margin:50px auto 0;padding:26px 18px calc(30px + env(safe-area-inset-bottom));
  display:flex;align-items:center;justify-content:center;gap:16px;color:var(--muted);font-size:14px;
}
footer::before,footer::after{content:"";height:1px;width:min(110px,18vw);background:var(--gold-soft)}
footer b{font-weight:500;letter-spacing:1px;direction:ltr}


/* ---------- العروض ---------- */
.offers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.offer{background:var(--card);border:1px solid var(--gold-soft);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.offer-media{position:relative;aspect-ratio:16/9}
.offer-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.offer .badge{transform:none}
.offer h3{font-size:21px;font-weight:700;line-height:1.35}
.offer .desc{color:var(--muted);font-size:15px}
.offer-prices{display:flex;align-items:baseline;gap:10px;margin-top:auto;padding-top:6px}
.old-price{color:var(--muted);text-decoration:line-through;font-size:15px}
.offer-until{font-size:13px;color:var(--muted)}

.offer-banner{grid-column:1/-1;border:1px solid var(--gold-soft);border-radius:14px;overflow:hidden;background:var(--card)}
.offer-banner img{width:100%;height:auto;display:block}
.offer .add-btn{align-self:flex-start;margin-top:6px}
/* ---------- معلومات المطعم ---------- */
.info{max-width:1000px;margin:56px auto 0;padding:0 18px;scroll-margin-top:70px}
.info-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 22px}
.info-row{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.info-row:last-child{border-bottom:0}
.info-ic{flex:none;width:40px;height:40px;border:1px solid var(--gold-soft);border-radius:50%;display:grid;place-items:center;color:var(--gold)}
.info-ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.info-main{flex:1;min-width:0}
.info-label{font-size:13px;color:var(--muted)}
.info-val{font-weight:600;font-size:16px}
.info-val a{color:inherit;text-decoration:none}
.info-val.ltr{direction:ltr;unicode-bidi:plaintext;text-align:right}
.hours{margin-top:4px;display:grid;gap:6px;max-width:380px}
.hours div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px}
.hours span:first-child{white-space:nowrap}
.hours span:last-child{color:var(--muted);white-space:nowrap;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:600;border:1px solid var(--gold);color:var(--gold)}
.chip.off{border-color:var(--line);color:var(--muted);text-decoration:line-through;font-weight:500}
.chip.off small{text-decoration:none;font-size:12px}
.link-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.link-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border:1px solid var(--gold);border-radius:999px;color:var(--gold);font-weight:600;font-size:14px;text-decoration:none;transition:background .2s,color .2s}
.link-btn:hover,.link-btn:active{background:var(--gold);color:#111}
.link-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- القائمة الجانبية + السلة ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;bottom:0;right:0;width:min(320px,86vw);z-index:50;
  background:#101011;border-inline-start:1px solid var(--line);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  padding:22px;display:flex;flex-direction:column;gap:6px;
}
.drawer.on{transform:none}
.drawer h4{font-size:18px;margin-bottom:10px;color:var(--gold)}
.drawer a{padding:13px 4px;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none;font-size:17px}

.cart{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;
  background:#101011;border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:80vh;display:flex;flex-direction:column;
}
.cart.on{transform:none}
.cart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cart-head h4{font-size:19px}
.cart-list{overflow:auto;flex:1}
.cart-empty{color:var(--muted);text-align:center;padding:26px 0}
.cart-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cart-item .n{flex:1;font-weight:500}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:28px;height:28px;border:1px solid var(--gold-soft);border-radius:50%;color:var(--gold)}
.cart-total{display:flex;justify-content:space-between;margin:14px 0 12px;font-weight:700;font-size:18px}
.send{width:100%;padding:14px;border-radius:12px;background:var(--gold);color:#111;font-weight:700;font-size:17px}
.send[disabled]{opacity:.4;cursor:not-allowed}

/* اختيار طريقة الاستلام في السلة */
.order-type{display:flex;gap:8px;margin-top:12px}
.opt{flex:1;padding:10px 8px;border:1px solid var(--line);border-radius:12px;font-weight:600;font-size:14px;color:var(--muted);transition:border-color .2s,color .2s,background .2s}
.opt.on{border-color:var(--gold);color:var(--gold);background:rgba(232,169,58,.08)}
.order-note{font-size:13px;color:var(--gold);margin-top:8px;text-align:center}
.cart-fee{display:flex;justify-content:space-between;margin-top:12px;font-size:15px;color:var(--muted)}
.info-note{font-size:13px;color:var(--muted);margin-top:8px}

/* ---------- الجوال ---------- */
@media (max-width:640px){
  .dish{flex-direction:column-reverse;min-height:0}
  .dish-media{min-height:210px;flex:none}
  .dish-media::after{background:linear-gradient(0deg,var(--card) 0%,transparent 45%)}
  .dish-body{padding:18px 20px 22px}
  .dish h3{font-size:25px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .hero-bg::after{background:linear-gradient(0deg,var(--bg) 4%,rgba(11,11,12,.55) 70%,rgba(11,11,12,.75) 100%)}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation:none!important;transition:none!important}
}

/* ===== تخصيص القالب ===== */
.topbar.solid{background:rgba(var(--bg-rgb),.92)}
.drawer,.cart{background:var(--panel)}
.hero-bg{background:var(--hero-bg)}
.hero-bg::before{content:var(--deco);position:absolute;left:6%;top:50%;transform:translateY(-50%);font-size:240px;opacity:.14;line-height:1}
.hero-bg::after{background:linear-gradient(270deg,rgba(var(--bg-rgb),.85) 0%,rgba(var(--bg-rgb),.4) 55%,rgba(var(--bg-rgb),.05) 100%),linear-gradient(0deg,var(--bg) 0%,transparent 40%)}
.ph{background:radial-gradient(circle at 50% 40%,var(--ph1),var(--ph2) 70%)}
.add-btn:hover,.add-btn:active,.link-btn:hover,.link-btn:active,.send,.cart-count{color:var(--on-gold)}
.hero h1,.section-head h2,.dish h3,.offer h3,.drawer h4{font-family:'Reem Kufi','Tajawal',sans-serif}
@media (max-width:640px){.hero-bg::before{font-size:150px;left:50%;transform:translate(-50%,-50%)}
.hero-bg::after{background:linear-gradient(0deg,var(--bg) 4%,rgba(var(--bg-rgb),.35) 70%,rgba(var(--bg-rgb),.5) 100%)}}

.catnav{position:sticky;top:72px;z-index:25;display:flex;gap:8px;overflow-x:auto;padding:10px 18px;background:rgba(var(--bg-rgb),.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);scrollbar-width:none}
.catnav::-webkit-scrollbar{display:none}
.catnav a{flex:none;padding:7px 16px;border:1px solid var(--line);border-radius:999px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s}
.catnav a.on{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
@media(min-width:900px){.catnav{justify-content:center}}
.section{scroll-margin-top:140px}
.hero-bg::before{pointer-events:none}
.hero-inner,.scroll-hint{z-index:2}
.dish,.mini,.offer{transition:transform .25s,box-shadow .25s}
.mini-media,.offer-media{overflow:hidden}
.mini-media img,.offer-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mini{min-width:0}.mini-body{min-width:0;overflow-wrap:anywhere}

/* 🍰 حلويات: باستيل، حواف دائرية كبيرة، حافة مسننة تحت الواجهة */
.hero{justify-content:center;text-align:center;padding-bottom:90px}
.hero-inner{text-align:center}.hero .rule{margin:22px auto 0;width:70px;height:6px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,transparent 10px 16px)}
.hero h1{color:#7a1f47}
.hero::after{content:"";position:absolute;inset:auto 0 -1px 0;height:22px;z-index:1;background:radial-gradient(circle at 11px 0,transparent 10px,var(--bg) 11px) 0 0/22px 22px repeat-x}
.hero-bg::before{opacity:.18}
.section-head .title-row::before,.section-head .title-row::after{content:"✿";background:none;width:auto;height:auto;color:var(--gold);font-size:22px}
.dish{border-radius:32px;border:2px dashed rgba(194,51,107,.3);box-shadow:0 14px 34px rgba(194,51,107,.10)}
.dish-media{margin:14px;border-radius:26px;overflow:hidden}.dish-media::after{display:none}
.mini{border:0;border-radius:26px;box-shadow:0 10px 26px rgba(194,51,107,.10)}
.mini:hover{transform:translateY(-5px) rotate(-.6deg)}
.mini-body{border-top:2px dotted var(--gold-soft)}
.badge{border-radius:999px;transform:rotate(-3deg);padding:5px 16px;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.add-btn{background:var(--gold);color:#fff;border-color:var(--gold)}
.add-btn:hover,.add-btn:active{background:#8f1f4e;color:#fff}
.offer{border-radius:28px;border-style:dashed}
@media(max-width:640px){.dish-media{margin:12px 12px 0}}
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="فتح الأقسام">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <img class="topbar-logo" id="topLogo" alt="" hidden>
  <button class="icon-btn" id="cartBtn" aria-label="السلة">
    <svg viewBox="0 0 24 24"><path d="M3 4h2.2l2.1 10.2a1.6 1.6 0 0 0 1.6 1.3h7.7a1.6 1.6 0 0 0 1.6-1.2L20 8H6.2"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="16.5" cy="19.5" r="1.3"/></svg>
    <span class="cart-count" id="cartCount">0</span>
  </button>
</header>

<section class="hero" id="top">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-inner">
    <img class="hero-logo" id="heroLogo" alt="" hidden>
    <span class="hero-logo-text" id="heroLogoText" hidden></span>
    <h1 id="heroTitle"></h1>
    <p id="heroTagline"></p>
    <div class="rule"></div>
  </div>
  <a class="scroll-hint" href="#menu" aria-label="انزل للقائمة"><i></i></a>
</section>

<main id="menu"></main>

<section class="info" id="info" hidden></section>

<footer><b id="footerText"></b></footer>

<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer" aria-label="الأقسام"><h4>الأقسام</h4></nav>
<aside class="cart" id="cart" aria-label="سلة الطلب">
  <div class="cart-head"><h4>طلبك</h4><button class="icon-btn" id="cartClose" aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="cart-list" id="cartList"></div>
  <div class="order-type" id="orderType"></div>
  <div class="order-note" id="orderNote" hidden></div>
  <div class="cart-fee" id="cartFee" hidden><span>رسوم التوصيل</span><span id="feeVal"></span></div>
  <div class="cart-total"><span>الإجمالي</span><span id="cartTotal"></span></div>
  <button class="send" id="sendBtn">إرسال الطلب عبر واتساب</button>
</aside>

<script>
/* ============================================================
   ⚙️ إعدادات المطعم — هذا هو الجزء الوحيد الذي تعدّله لكل عميل
   ============================================================ */
const CONFIG = {
  pageTitle: "قائمة الحلويات",
  name:      "حلاوة تفرّح القلب",
  tagline:   "صنع بحب، ويُقدَّم بحب",
  logo:      "",
  logoText:  "اسم المحل",
  heroImage: "",              // مثال: "images/hero.jpg" (ضع الصورة داخل مجلد images)
  footer:    "@sweets",
  currency:  "ر.س",

  offers: {

        { name: "بسبوسة بالقشطة", desc: "بسبوسة طرية بالسميد وجوز الهند تعلوها قشطة طازجة.", image: "sw_bs.webp", icon: "🍮", price: 18, badge: { text: "جديد", type: "new" }, tags: [{ icon: "🥥", label: "جوز هند" }, { icon: "🥛", label: "قشطة" }] }

/* ============================================================
   ما بعد هذا السطر لا تحتاج تعديله
   ============================================================ */
const $ = id => document.getElementById(id);
const cartOn = !!CONFIG.whatsapp;
const money = n => `${n} ${CONFIG.currency}`;

/* الهوية */
document.title = CONFIG.pageTitle;
$('heroTitle').textContent = CONFIG.name;
$('heroTagline').textContent = CONFIG.tagline;
$('footerText').textContent = CONFIG.footer;
if (CONFIG.heroImage) $('heroBg').style.backgroundImage = `url("${CONFIG.heroImage}")`;
if (CONFIG.logo) {
  [$('heroLogo'), $('topLogo')].forEach(i => { i.src = CONFIG.logo; i.alt = CONFIG.logoText; i.hidden = false; });
} else if (CONFIG.logoText) {
  $('heroLogoText').textContent = CONFIG.logoText; $('heroLogoText').hidden = false;
}
if (!cartOn) $('cartBtn').style.visibility = 'hidden';

/* الصورة أو البديل */
function media(item){
  if (item.image) {
    const img = new Image();
    img.src = item.image; img.alt = item.name; img.loading = 'lazy';
    img.onerror = () => img.replaceWith(placeholder(item));
    return img;
  }
  return placeholder(item);
}
function placeholder(item){
  const d = document.createElement('div');
  d.className = 'ph'; d.innerHTML = `<span>${item.icon || '🍽️'}</span>`;
  return d;
}
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const priceHtml = p => `<span class="price">${p}<small>${CONFIG.currency}</small></span>`;

let uid = 0; const items = {};
function addBtn(item){
  const b = el('button', 'add-btn', 'أضف');
  b.onclick = () => addToCart(item.__id);
  return b;
}

/* بناء الأقسام */
const main = $('menu'), drawer = $('drawer');
CONFIG.categories.forEach(cat => {
  const sec = el('section', 'section'); sec.id = cat.id;
  sec.append(el('div', 'section-head',
    `<div class="title-row"><h2>${cat.title}</h2></div>${cat.subtitle ? `<p>${cat.subtitle}</p>` : ''}`));

  if (cat.layout === 'grid') {
    const g = el('div', 'grid');
    cat.items.forEach(it => {
      it.__id = ++uid; items[it.__id] = it;
      const c = el('article', 'mini');
      const m = el('div', 'mini-media'); m.append(media(it));
      const b = el('div', 'mini-body', `<span>${it.name}</span>`);
      if (CONFIG.showPrices && it.price != null) b.insertAdjacentHTML('beforeend', priceHtml(it.price));
      if (cartOn) b.append(addBtn(it));
      c.append(m, b); g.append(c);
    });
    sec.append(g);
  } else {
    cat.items.forEach(it => {
      it.__id = ++uid; items[it.__id] = it;
      const c = el('article', 'dish');
      const body = el('div', 'dish-body');
      if (it.badge) body.append(el('span', `badge ${it.badge.type || 'chef'}`, it.badge.text));
      body.append(el('h3', '', it.name));
      if (it.desc) body.append(el('p', 'desc', it.desc));
      if ((CONFIG.showPrices && it.price != null) || cartOn) {
        const r = el('div', 'price-row');
        if (CONFIG.showPrices && it.price != null) r.insertAdjacentHTML('beforeend', priceHtml(it.price));
        if (cartOn) r.append(addBtn(it));
        body.append(r);
      }
      if (it.tags && it.tags.length)
        body.append(el('div', 'tags', it.tags.map(t => `<div class="tag"><span>${t.icon}</span>${t.label}</div>`).join('')));
      const m = el('div', 'dish-media'); m.append(media(it));
      c.append(body, m); sec.append(c);
    });
  }
  main.append(sec);
  drawer.insertAdjacentHTML('beforeend', `<a href="#${cat.id}">${cat.title}</a>`);
});

/* ---------- قسم العروض ---------- */
const O = CONFIG.offers;
if (O && O.enabled && O.items && O.items.length) {
  const sec = el('section', 'section'); sec.id = 'offers';
  sec.append(el('div', 'section-head',
    `<div class="title-row"><h2>${O.title || 'العروض'}</h2></div>${O.subtitle ? `<p>${O.subtitle}</p>` : ''}`));
  const g = el('div', 'offers-grid');
  O.items.forEach(o => {
    if (o.type === 'banner') {
      if (!o.image) return;
      const c = el('div', 'offer-banner');
      const img = new Image(); img.src = o.image; img.alt = o.title || 'عرض'; img.loading = 'lazy';
      img.onerror = () => c.remove();
      c.append(img); g.append(c); return;
    }
    o.name = o.title; o.price = o.newPrice; o.__id = ++uid; items[o.__id] = o;
    const c = el('article', 'offer');
    if (o.image) { const m = el('div', 'offer-media'); m.append(media({ image: o.image, name: o.title, icon: '🎁' })); c.append(m); }
    const b = el('div', 'offer-body');
    if (o.badge) b.append(el('span', 'badge chef', o.badge));
    b.append(el('h3', '', o.title));
    if (o.desc) b.append(el('p', 'desc', o.desc));
    if (CONFIG.showPrices && o.newPrice != null) {
      b.append(el('div', 'offer-prices',
        priceHtml(o.newPrice) + (o.oldPrice != null ? `<span class="old-price">${o.oldPrice} ${CONFIG.currency}</span>` : '')));
    }
    if (o.until) b.append(el('div', 'offer-until', o.until));
    if (cartOn && o.newPrice != null) b.append(addBtn(o));
    c.append(b); g.append(c);
  });
  sec.append(g); main.prepend(sec);
  drawer.querySelector('h4').insertAdjacentHTML('afterend', `<a href="#offers">${O.title || 'العروض'}</a>`);
}

/* ---------- معلومات المطعم ---------- */
(function(){
  const I = CONFIG.info; if (!I) return;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ic = {
    phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
    pin:   '<path d="M12 21s-7-5.6-7-11a7 7 0 0 1 14 0c0 5.4-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    bike:  '<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l3-7h5l4 7M9 10l-1-3H6M14 10l-1.5-3H11"/>',
    map:   '<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/>',
    insta: '<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".8"/>',
    tiktok:'<path d="M14 4v10.5a3.5 3.5 0 1 1-3.5-3.5M14 4c.4 2.3 1.9 3.800 4.500 4"/>'
  };
  const svg = k => `<svg viewBox="0 0 24 24">${ic[k]}</svg>`;
  const row = (k, label, inner) =>
    `<div class="info-row"><span class="info-ic">${svg(k)}</span><div class="info-main"><div class="info-label">${label}</div>${inner}</div></div>`;
  const social = (v, base) => /^https?:\/\//i.test(v) ? v : base + v.replace(/^@/, '');

  let rows = '';
  if (I.phone) rows += row('phone', 'رقم الهاتف',
    `<div class="info-val ltr"><a href="tel:${esc(I.phone.replace(/[^\d+]/g, ''))}">${esc(I.phone)}</a></div>`);
  if (I.location) rows += row('pin', 'الموقع', `<div class="info-val">${esc(I.location)}</div>`);
  if (I.hours && I.hours.length) rows += row('clock', 'أوقات العمل',
    `<div class="hours">${I.hours.map(h => `<div><span>${esc(h.days)}</span><span>${esc(h.time)}</span></div>`).join('')}</div>`);
  let links = '';
  if (I.mapsUrl)   links += `<a class="link-btn" href="${esc(I.mapsUrl)}" target="_blank" rel="noopener">${svg('map')}افتح في الخريطة</a>`;
  if (I.instagram) links += `<a class="link-btn" href="${esc(social(I.instagram, 'https://instagram.com/'))}" target="_blank" rel="noopener">${svg('insta')}إنستغرام</a>`;
  if (I.tiktok)    links += `<a class="link-btn" href="${esc(social(I.tiktok, 'https://www.tiktok.com/@'))}" target="_blank" rel="noopener">${svg('tiktok')}تيك توك</a>`;
  if (links) rows += row('map', 'روابط', `<div class="link-row">${links}</div>`);

  if (!rows) return;
  const box = $('info'); box.innerHTML = `<div class="info-card">${rows}</div>`; box.hidden = false;
  drawer.insertAdjacentHTML('beforeend', '<a href="#info">معلومات المطعم</a>');
})();

/* شريط الأقسام الثابت */
(function(){
  const links=[...drawer.querySelectorAll('a')].filter(a=>a.getAttribute('href')!=='#info');
  if(links.length<2) return;
  const nav=el('nav','catnav'); nav.setAttribute('aria-label','تصفح الأقسام');
  links.forEach(a=>nav.append(a.cloneNode(true)));
  $('menu').before(nav);
  const map=new Map([...nav.children].map(a=>[a.getAttribute('href').slice(1),a]));
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting) return;
    map.forEach(a=>a.classList.remove('on'));
    const a=map.get(e.target.id); if(!a) return;
    a.classList.add('on'); a.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  }),{rootMargin:'-30% 0px -65% 0px'});
  document.querySelectorAll('main .section').forEach(s=>io.observe(s));
})();

/* الهيدر يتحول عند التمرير */
const bar = $('topbar');
const onScroll = () => bar.classList.toggle('solid', scrollY > 120);
addEventListener('scroll', onScroll, { passive: true }); onScroll();

/* القائمة الجانبية والسلة */
const scrim = $('scrim'), cart = $('cart');
const closeAll = () => { drawer.classList.remove('on'); cart.classList.remove('on'); scrim.classList.remove('on'); };
$('menuBtn').onclick = () => { drawer.classList.add('on'); scrim.classList.add('on'); };
$('cartBtn').onclick = () => { renderCart(); cart.classList.add('on'); scrim.classList.add('on'); };
$('cartClose').onclick = closeAll; scrim.onclick = closeAll;
drawer.addEventListener('click', e => { if (e.target.tagName === 'A') closeAll(); });
addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });

/* السلة */
const basket = {};
const INFO = CONFIG.info || {};
const MODES = [];
if (INFO.pickup)   MODES.push({ id: 'pickup',   label: 'استلام من الفرع' });
if (INFO.delivery) MODES.push({ id: 'delivery', label: 'توصيل' });
let mode = MODES.length ? MODES[0].id : null;
const feeNow = () => (mode === 'delivery' ? (INFO.deliveryFee || 0) : 0);
function addToCart(id){ basket[id] = (basket[id] || 0) + 1; updateCount(); }
function updateCount(){
  const n = Object.values(basket).reduce((a, b) => a + b, 0);
  const c = $('cartCount'); c.textContent = n; c.style.display = n ? 'grid' : 'none';
}
function renderCart(){
  const list = $('cartList'); list.innerHTML = '';
  const ids = Object.keys(basket).filter(k => basket[k] > 0);
  if (!ids.length) list.innerHTML = '<div class="cart-empty">السلة فارغة</div>';
  let total = 0;
  ids.forEach(id => {
    const it = items[id]; total += (it.price || 0) * basket[id];
    const row = el('div', 'cart-item', `<span class="n">${it.name}</span>`);
    const q = el('div', 'qty');
    const minus = el('button', '', '−'), plus = el('button', '', '+');
    minus.onclick = () => { basket[id]--; updateCount(); renderCart(); };
    plus.onclick  = () => { basket[id]++; updateCount(); renderCart(); };
    q.append(plus, el('span', '', basket[id]), minus);
    row.append(q); list.append(row);
  });
  /* طريقة الاستلام + الرسوم */
  const ot = $('orderType'); ot.innerHTML = ''; ot.hidden = !MODES.length;
  MODES.forEach(m => {
    const b = el('button', 'opt' + (m.id === mode ? ' on' : ''), m.label);
    b.setAttribute('aria-pressed', m.id === mode);
    b.onclick = () => { mode = m.id; renderCart(); };
    ot.append(b);
  });
  const note = $('orderNote');
  note.hidden = !(mode === 'delivery' && INFO.deliveryNote); note.textContent = INFO.deliveryNote || '';
  const fee = feeNow(); total += fee;
  $('cartFee').hidden = !(mode === 'delivery' && fee && CONFIG.showPrices && ids.length);
  $('feeVal').textContent = money(fee);
  $('cartTotal').textContent = CONFIG.showPrices ? money(total) : '';
  $('sendBtn').disabled = !ids.length;
}
$('sendBtn').onclick = () => {
  const lines = Object.keys(basket).filter(k => basket[k] > 0).map(id => {
    const it = items[id]; return `• ${it.name} × ${basket[id]}` + (CONFIG.showPrices && it.price ? ` — ${money(it.price * basket[id])}` : '');
  });
  if (!lines.length) return;
  const m = MODES.find(x => x.id === mode);
  let msg = `مرحباً، أود طلب:\n${lines.join('\n')}`;
  if (m) msg += `\n\nطريقة الاستلام: ${m.label}`;
  if (mode === 'delivery' && INFO.deliveryNote) msg += ` (${INFO.deliveryNote})`;
  if (CONFIG.showPrices) {
    if (mode === 'delivery' && feeNow()) msg += `\nرسوم التوصيل: ${money(feeNow())}`;
    msg += `\nالإجمالي: ${$('cartTotal').textContent}`;
  }
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
};
</script>
